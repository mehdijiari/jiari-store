<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIARI STORE</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma, Arial;
  background:#f5f6f8;
  text-align:center;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#0d6efd,#084298);
  color:#fff;
  padding:28px 10px;
}
.header h1{margin:0;font-size:26px}
.header p{margin-top:6px;opacity:.9;font-size:14px}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:16px;
  padding:20px;
}

/* CARD */
.card{
  background:#fff;
  padding:14px;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.1);
}
.card img{
  width:100%;
  height:140px;
  object-fit:cover;
  border-radius:8px;
}
.card h3{font-size:14px;margin:10px 0 4px}
.card p{font-size:12px;color:#555;margin:0}
.price{color:#0d6efd;font-weight:bold;margin:8px 0}

button{
  background:#0d6efd;
  color:#fff;
  border:none;
  padding:8px 14px;
  border-radius:20px;
  cursor:pointer;
  font-size:12px;
}
button:hover{background:#084298}

/* CART */
.cart-bar{
  position:fixed;
  bottom:0;
  right:0;
  left:0;
  background:#fff;
  border-top:1px solid #ddd;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.cart-count{
  background:#dc3545;
  color:#fff;
  border-radius:50%;
  padding:4px 8px;
  font-size:12px;
}

/* SOCIAL */
.social-fixed{
  position:fixed;
  left:8px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:8px;
}
.social-fixed img{
  width:32px;height:32px;border-radius:50%;
}

/* FOOTER */
footer{margin:60px 0 20px;color:#777;font-size:12px}
</style>
</head>

<body>

<div class="header">
  <h1>JIARI STORE</h1>
  <p>أفضل العروض لأكسيسوارات الرجال و النساء</p>
</div>

<div class="products">
  <div class="card">
    <img src="images/images.jpeg">
    <h3>ساعة يدوية نسائية</h3>
    <p>فخمة</p>
    <div class="price">99 درهم</div>
    <button onclick="addToCart()">أضف للسلة</button>
  </div>

  <div class="card">
    <img src="images/khdar.jpeg">
    <h3>ساعة رجالية</h3>
    <p>أناقة</p>
    <div class="price">220 درهم</div>
    <button onclick="addToCart()">أضف للسلة</button>
  </div>

  <div class="card">
    <img src="images/sacnoire.jpeg">
    <h3>حقيبة نسائية</h3>
    <p>عملية</p>
    <div class="price">75 درهم</div>
    <button onclick="addToCart()">أضف للسلة</button>
  </div>
</div>

<div class="social-fixed">
  <a href="https://wa.me/212684705186" target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
  </a>
  <a href="https://www.instagram.com/jiari_store" target="_blank">
    <img src="https://cdn-icons-png.flaticon.com/512/733/733558.png">
  </a>
</div>

<div class="cart-bar">
  <span>🛒 السلة</span>
  <span class="cart-count" id="cartCount">0</span>
</div>

<footer>JIARI STORE © 2026</footer>

<script>
let count = 0;
function addToCart(){
  count++;
  document.getElementById("cartCount").innerText = count;
}
</script>

</body>
</html>
